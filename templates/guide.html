<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{t:guide.metaTitle}}</title>
  <meta name="description" content="{{a:guide.description}}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="{{canonical}}">
  {{alternates}}
  <meta name="theme-color" content="#237F52">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="mask-icon" href="icons/safari-pinned-tab.svg" color="#237F52">
  <link rel="manifest" href="icons/manifest.webmanifest">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:locale" content="{{og_locale}}">
  {{og_alternates}}
  <meta property="og:site_name" content="{{a:site.name}}">
  <meta property="og:title" content="{{a:guide.metaTitle}}">
  <meta property="og:description" content="{{a:guide.description}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{a:site.name}} - {{a:og.tagline}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{og_image}}">
  <script type="application/ld+json">
  {{jsonld:guide}}
  </script>
  <link rel="stylesheet" href="css/page.css">
</head>
<body>
  <main>
{{language_links}}{{content}}  </main>
  <script src="js/i18n.js"></script>
  <script src="js/lang/{{lang}}.js"></script>
  <script src="js/format.js"></script>
  <script src="js/dae-view.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/guide-examples.js"></script>
  <script src="js/guide-infocards.js"></script>
  <script src="js/widget-logo.js"></script>
  <script src="js/widget.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
