<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{t:index.title}}</title>
  <meta name="description" content="{{a:index.description}}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="{{canonical}}">
  {{alternates}}
  <meta name="theme-color" content="#237F52">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="mask-icon" href="icons/safari-pinned-tab.svg" color="#237F52">
  <link rel="manifest" href="icons/manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:locale" content="{{og_locale}}">
  {{og_alternates}}
  <meta property="og:site_name" content="{{a:site.name}}">
  <meta property="og:title" content="{{a:index.title}}">
  <meta property="og:description" content="{{a:index.description}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{a:site.name}} - {{a:og.tagline}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{og_image}}">
  <script type="application/ld+json">
  {{jsonld:index}}
  </script>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section id="intro" class="sr-only">
    <h1>{{t:index.title}}</h1>
    <p>{{t:intro.p1}}</p>
    <p>{{h:intro.p2}}</p>
  </section>
  <noscript><p style="margin:0;padding:12px;background:#fff3cd;color:#1d1d1f;font:16px/1.4 system-ui">{{h:index.noscript}}</p></noscript>
  <div id="sim-banner" hidden role="alert">
    <p>{{h:sim.banner}}</p>
    <p class="sim-pos">{{t:sim.position}}</p>
    <button id="sim-exit" type="button">{{t:sim.exit}}</button>
  </div>
  <div id="urgence">{{h:urgence.bar}}</div>
  <div id="quick">
    <div class="quick-box">
      <p class="quick-title">{{h:quick.title}}</p>
      <div class="quick-row">
        <button id="quick-adult" type="button">{{t:quick.adult}}</button>
        <button id="quick-child" type="button">{{t:quick.child}}</button>
      </div>
    </div>
    <div id="posline"></div>
  </div>
  <div id="map-wrap">
    <div id="map" role="region" aria-label="{{a:map.label}}"></div>
    <div id="status" role="status"></div>
    <div id="map-ui">
    <div id="bottom-left">
      <button id="filters-toggle" type="button" aria-controls="filters" aria-expanded="false">{{t:nav.filters}}</button>
      <button id="data-toggle" type="button">{{t:nav.data}}</button>
      <a id="guide-toggle" href="{{page:guide}}"><img src="icons/favicon.svg" alt="" width="20" height="20"><span>{{t:nav.guide}}</span></a>
    </div>
    <div id="filters" role="group" aria-label="{{a:filters.title}}">
      <div class="filters-head"><b>{{t:filters.title}}</b><button id="filters-close" type="button" class="sheet-close">{{t:common.close}}</button></div>
      <fieldset>
        <legend>{{t:filters.access}}</legend>
        <label><input type="checkbox" autocomplete="off" data-group="access" value="h24"><i class="dot" style="background:#1b873f"></i> <span>{{t:access.h24}}</span></label>
        <label><input type="checkbox" autocomplete="off" data-group="access" value="limited"><i class="dot" style="background:#e07b00"></i> <span>{{t:access.limited}}</span></label>
        <label><input type="checkbox" autocomplete="off" data-group="access" value="unknown"><i class="dot" style="background:#1a6fd1"></i> <span>{{t:access.unknown}}</span></label>
      </fieldset>
      <fieldset>
        <legend>{{t:filters.maint}}</legend>
        <label><input type="checkbox" autocomplete="off" data-group="maint" value="ok"><svg class="ring-svg" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#fff" stroke="#1b873f" stroke-width="4.5"/></svg> <span>{{t:filters.maintOk}}</span></label>
        <label><input type="checkbox" autocomplete="off" data-group="maint" value="unknown"><svg class="ring-svg" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#fff" stroke="#8a8a8a" stroke-width="4.5" stroke-dasharray="21.83 5.4"/></svg> <span>{{t:filters.maintUnknown}}</span></label>
        <label><input type="checkbox" autocomplete="off" data-group="maint" value="doubt"><svg class="ring-svg" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#fff" stroke="#d0021b" stroke-width="4.5" stroke-dasharray="5.5 4.71"/></svg> <span>{{t:filters.maintDoubt}}</span></label>
      </fieldset>
      <fieldset>
        <legend>{{t:filters.kids}}</legend>
        <label><input type="checkbox" autocomplete="off" id="f-ped"><i class="marker-legend"><svg viewBox="0 0 24 24"><path fill="#fff" fill-rule="evenodd" d="M12 4.6a8.6 8.6 0 1 0 0 17.2 8.6 8.6 0 0 0 0-17.2zM8.6 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM15.4 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM8.3 15.9Q12 20.1 15.7 15.9Q12 18 8.3 15.9z"/><circle cx="4.1" cy="14" r="1.9" fill="#fff"/><circle cx="19.9" cy="14" r="1.9" fill="#fff"/><path d="M12 5.2c-.2-2.2 2.6-3.4 4-1.8 1 1.2-.1 2.6-1.4 2.2" stroke="#fff" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg></i> <span>{{t:filters.pedOnly}}</span></label>
        <label class="sub"><input type="checkbox" autocomplete="off" id="f-ped-unknown"><i class="marker-legend unknown"></i> <span>{{t:filters.pedUnknown}}</span></label>
      </fieldset>
    </div>
    </div>
    <div id="results" aria-live="polite"></div>
  </div>
{{language_control}}
  <button id="locate" type="button" aria-label="{{a:locate.label}}" title="{{a:locate.label}}" data-tip="{{a:locate.tip}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg></button>
  <script src="vendor/leaflet/leaflet.js"></script>
  <div id="data-panel" role="dialog" aria-modal="true" aria-label="{{a:nav.data}}" hidden></div>
  <script src="js/i18n.js"></script>
  <script src="js/lang/{{lang}}.js"></script>
  <script src="js/format.js"></script>
  <script src="js/dae-view.js"></script>
  <script src="js/data.js"></script>
  <script src="js/places.js"></script>
  <script src="js/app.js"></script>
  <script src="js/quick.js"></script>
</body>
</html>
